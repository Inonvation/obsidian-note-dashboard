name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── 插件版 ──
  release-plugin:
    name: 发布插件版
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: plugin/package-lock.json

      - name: 安装依赖
        working-directory: plugin
        run: npm ci

      - name: 构建插件
        working-directory: plugin
        run: npm run build

      - name: 上传插件版
        uses: softprops/action-gh-release@v2
        with:
          files: |
            plugin/main.js
            plugin/manifest.json
            plugin/styles.css
          generate_release_notes: true
          make_latest: true

  # ── Dataview 版（等插件版上传完再执行） ──
  release-dataview:
    name: 发布 Dataview 版
    needs: release-plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 上传 Dataview 版
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dataview/我的笔记看板.md
